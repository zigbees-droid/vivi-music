name: Build JPlayer APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set App Name to JPlayer
        run: |
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">JPlayer<\/string>/' app/src/main/res/values/strings.xml
          fi

      - name: Inject Local Storage Permissions
        run: |
          if ! grep -q "READ_MEDIA_AUDIO" app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' app/src/main/AndroidManifest.xml
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename to JPlayer.apk
        run: |
          mkdir -p output
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output/JPlayer.apk \;

      - name: Upload JPlayer APK
        uses: actions/upload-artifact@v4
        with:
          name: JPlayer
          path: output/JPlayer.apk
          retention-days: 7
